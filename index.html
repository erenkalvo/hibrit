<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hibrit">
<title>Hibrit Plan 16 Hafta</title>
<style>
:root{
  --bg:#1c2230;--surf:#273040;--surf2:#303a4d;--line:#3a4558;
  --ink:#ede9e0;--ink2:#a9b1c2;--mute:#6f7a8f;
  --amber:#f2b33d;--sage:#8fc7a3;--rose:#e58a8a;--sky:#7fb3e6;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.wkbar{display:flex;align-items:center;gap:10px}
.wkbar button{background:var(--surf);border:0;color:var(--ink);font-size:22px;width:40px;height:40px;border-radius:10px}
.wkbar .lab{flex:1;text-align:center}
.wkbar .lab b{font-size:20px;font-variant-numeric:tabular-nums}
.wkbar .lab small{display:block;color:var(--ink2);font-size:13px}
.segs{display:flex;gap:3px;margin-top:8px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--amber)}
.segs i.dl{background:var(--sky)}
.segs i.cur{outline:2px solid var(--ink);outline-offset:1px}
main{padding:14px 16px 20px;max-width:560px;margin:0 auto}
h1{font-size:24px;font-weight:700;margin:6px 0 4px;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:22px 0 8px}
p{margin:6px 0;color:var(--ink2)}
p.ink{color:var(--ink)}
.card{background:var(--surf);border-radius:var(--r);padding:14px;margin:10px 0}
.card.tint{background:var(--surf2)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .n{width:22px;flex:none;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:2px}
.row .t{flex:1}
.row .t b{display:block;font-weight:600}
.row .t span{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.row .m{flex:none;text-align:right;color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums;padding-top:2px}
.row.done .t b{color:var(--mute);text-decoration:line-through}
.chip{display:inline-block;background:rgba(242,179,61,.15);color:var(--amber);font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.chip.b{background:rgba(127,179,230,.15);color:var(--sky)}
.chip.g{background:rgba(143,199,163,.15);color:var(--sage)}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--surf2);color:var(--ink2);font-size:13px;margin:2px 4px 2px 0}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font-size:11px;padding:6px 0 2px;font-family:inherit}
.tabs button.on{color:var(--amber)}
.tabs button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.day{background:var(--surf2);border-radius:10px;padding:8px 2px;text-align:center;min-height:62px}
.day small{display:block;color:var(--mute);font-size:11px;margin-bottom:4px}
.day b{font-size:13px;display:block;line-height:1.15}
.day.g b{color:var(--amber)}.day.v b{color:var(--rose)}.day.r b{color:var(--sage)}.day.o b{color:var(--mute);font-weight:400}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sel button{background:var(--surf);border:1px solid var(--line);color:var(--ink2);padding:9px 12px;border-radius:10px;font-size:14px;font-family:inherit}
.sel button.on{background:var(--amber);color:#1c2230;border-color:var(--amber);font-weight:700}
.big{background:var(--surf);border:1px solid var(--line);color:var(--ink);padding:12px;border-radius:12px;font-size:15px;width:100%;font-family:inherit;margin:8px 0}
.warm{font-size:15px}
.warm li{margin:4px 0;color:var(--ink2)}
ul{padding-left:18px;margin:6px 0}
li{margin:5px 0;color:var(--ink2)}
li b{color:var(--ink);font-weight:600}
.sum{display:flex;justify-content:space-between;color:var(--ink2);font-size:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:baseline}
.head small{color:var(--mute)}
details{margin:8px 0}
summary{cursor:pointer;color:var(--ink);font-weight:600;padding:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;border-top:0}
td{color:var(--ink2)}td:first-child{color:var(--ink)}
.hint{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <div class="wkbar">
    <button onclick="setWeek(week-1)">‹</button>
    <div class="lab"><b id="wkNum">Hafta 1</b><small id="wkPhase"></small></div>
    <button onclick="setWeek(week+1)">›</button>
  </div>
  <div class="segs" id="segs"></div>
</header>
<main id="main"></main>
<nav class="tabs">
  <button data-t="hafta" onclick="go('hafta')"><i>▦</i>Hafta</button>
  <button data-t="seans" onclick="go('seans')"><i>▲</i>Seanslar</button>
  <button data-t="kural" onclick="go('kural')"><i>≡</i>Kurallar</button>
  <button data-t="besin" onclick="go('besin')"><i>◐</i>Beslenme</button>
  <button data-t="test" onclick="go('test')"><i>◎</i>Testler</button>
  <button data-t="yol" onclick="go('yol')"><i>✈</i>Yol</button>
</nav>

<script>
/* ---------- STATE (bellekte, sayfa kapanınca sıfırlanır) ---------- */
let week=1, tab='hafta', combo='3G1V1R', session='UA', done={};
const DELOAD=[4,8,12,16];

/* ---------- BLOK MANTIĞI ---------- */
function phase(w){
  if(w<=2) return {name:'Blok 1: Yeniden giriş',short:'Giriş',bb:3,t:2,circ:3,vo2:'4x3 dk',run:'10 dk koşu / 1 dk yürüyüş x3'};
  if(w===3) return {name:'Blok 1: Hacim açılıyor',short:'Hacim',bb:4,t:2,circ:3,vo2:'4x4 dk',run:'12 dk koşu / 1 dk yürüyüş x3'};
  if(w===4) return {name:'Blok 1: Deload + test',short:'Deload',bb:2,t:1,circ:2,vo2:'3x3 dk hafif',run:'Kolay 25 dk, ardından 3K test',deload:true};
  if(w<=7) return {name:'Blok 2: Hacim',short:'Hacim',bb:4,t:2,circ:4,vo2:w<=6?'5x4 dk':'6x4 dk',run:w===5?'15 dk koşu / 1 dk yürüyüş x3':w===6?'Devamlı 30 dk':'Devamlı 35 dk'};
  if(w===8) return {name:'Blok 2: Deload + test',short:'Deload',bb:2,t:1,circ:2,vo2:'3x3 dk hafif',run:'Kolay 25 dk, ardından 5K test',deload:true};
  if(w<=11) return {name:'Blok 3: Yoğunluk',short:'Yoğunluk',bb:4,t:2,circ:3,vo2:'5x4 dk (bike) / 30 sn sert 30 sn hafif x14 (koşu)',run:w===9?'Devamlı 35 dk':w===10?'Devamlı 40 dk':'Devamlı 40 dk, son 10 dk hafif hızlı',heavy:true};
  if(w===12) return {name:'Blok 3: Deload + test',short:'Deload',bb:2,t:1,circ:2,vo2:'3x3 dk hafif',run:'Kolay 25 dk, ardından 5K test',deload:true};
  if(w<=15) return {name:'Blok 4: Zirve',short:'Zirve',bb:4,t:2,circ:3,vo2:'6x3 dk sert (bike) / 4x800 m 6:00 tempo (koşu)',run:w===13?'Devamlı 40 dk':w===14?'Devamlı 45 dk':'Devamlı 35 dk, ortada 3x5 dk tempo',heavy:true,peak:true};
  return {name:'Blok 4: Final test haftası',short:'Test',bb:2,t:1,circ:2,vo2:'Yok, yerine test',run:'Kolay 20 dk, ardından 5K final test',deload:true};
}

/* ---------- SEANSLAR ---------- */
/* tip: bb = barbell bileşik (blok setine göre), t = tükenme, fx = sabit, circ = devre, ss = süperset, int = interval */
const S={
 UA:{name:'Upper A',sub:'Yatay itme + çekme',rows:[
  {tip:'bb',ex:'Barbell bench press',rep:'8-10',rest:'90 sn',min:6.5,hv:'5-6'},
  {tip:'t',ex:'Seated cable row',rep:'8-12',rest:'75 sn',min:3.5},
  {tip:'circ',ex:'Devre 1',det:'KB swing 16 kg x15 + ip 40 sn',rest:'tur arası 45 sn',min:5.5},
  {tip:'t',ex:'Incline DB press',rep:'8-12',rest:'75 sn',min:3.5},
  {tip:'fx',ex:'Bantlı barfiks',rep:'3 x max (hedef 5-8)',rest:'90 sn',min:5.5,note:'Progresyon: bant hafifledikçe ilerle'},
  {tip:'t',ex:'DB tek kol row',rep:'8-12',rest:'60 sn',min:3.5},
  {tip:'t',ex:'DB shrug',rep:'12-15',rest:'45 sn',min:2.5},
  {tip:'ss',ex:'Süperset',det:'DB lateral raise x12 + face pull x15',rep:'2 tur',rest:'60 sn',min:4.5,t:true},
  {tip:'ss',ex:'Süperset',det:'Triceps pushdown x12 + hammer curl x12',rep:'2 tur',rest:'60 sn',min:4.5,t:true},
  {tip:'int',ex:'İntervaller',det:'Spin bike 20 sn sert / 40 sn hafif x6',min:6}
 ]},
 LA:{name:'Lower A',sub:'Squat ağırlıklı',rows:[
  {tip:'bb',ex:'Barbell back squat',rep:'6-8',rest:'120 sn',min:8,hv:'4-6'},
  {tip:'t',ex:'Leg press',rep:'8-12',rest:'90 sn',min:4},
  {tip:'circ',ex:'Devre 1',det:'Goblet squat 20 kg x10 + burpee x6',rest:'tur arası 45 sn',min:5.5},
  {tip:'t',ex:'Leg curl',rep:'10-12',rest:'60 sn',min:3},
  {tip:'bb',ex:'DB walking lunge',rep:'10/bacak',rest:'75 sn',min:6,hv:'8/bacak',cap3:true},
  {tip:'t',ex:'Standing calf raise',rep:'12-15',rest:'45 sn',min:2.5},
  {tip:'ss',ex:'Core süperset',det:'Kablo crunch x12-15 + plank 40 sn',rep:'3 tur',rest:'45 sn',min:6},
  {tip:'fx',ex:"Farmer's carry",rep:'3 x 40 m, 2x20 kg KB',rest:'60 sn',min:4},
  {tip:'int',ex:'İntervaller',det:'İp 30 sn / 30 sn dinlen x8',min:8}
 ]},
 UB:{name:'Upper B',sub:'Dikey itme + çekme',rows:[
  {tip:'bb',ex:'Makine shoulder press',rep:'8-10',rest:'90 sn',min:6.5,hv:'6-8'},
  {tip:'t',ex:'Lat pulldown',rep:'8-12',rest:'75 sn',min:3.5},
  {tip:'circ',ex:'Devre 1',det:'Spin bike 30 sn sert + KB swing 16 kg x12',rest:'tur arası 45 sn',min:5},
  {tip:'fx',ex:'Negatif barfiks',rep:'3 x 4 (5 sn iniş)',rest:'90 sn',min:4.5,note:'Sandalyeden çık, kontrollü in'},
  {tip:'t',ex:'Chest press makinesi',rep:'8-12',rest:'75 sn',min:3.5},
  {tip:'fx',ex:'Şınav',rep:'3 x max (form bozulmadan)',rest:'75 sn',min:4.5,note:'Progresyon: 20+ olunca ayak yüksekte'},
  {tip:'ss',ex:'Süperset',det:'Kablo lateral raise x12 + DB rear delt fly x15',rep:'2 tur',rest:'60 sn',min:4.5,t:true},
  {tip:'ss',ex:'Süperset',det:'DB curl x12 + kablo rope pushdown x12',rep:'2 tur',rest:'60 sn',min:4.5,t:true},
  {tip:'int',ex:'İntervaller',det:'Spin bike 20 sn sert / 40 sn hafif x8',min:8}
 ]},
 LB:{name:'Lower B',sub:'Hinge ağırlıklı + full body',rows:[
  {tip:'bb',ex:'Barbell RDL',rep:'8-10',rest:'120 sn',min:8,hv:'6-8'},
  {tip:'bb',ex:'Bulgarian split squat DB',rep:'8/bacak',rest:'90 sn',min:7,hv:'6/bacak',cap3:true},
  {tip:'circ',ex:'Devre 1',det:'KB swing 16 kg x20 + şınav x10',rest:'tur arası 45 sn',min:5.5},
  {tip:'t',ex:'Leg extension',rep:'10-12',rest:'60 sn',min:3},
  {tip:'bb',ex:'Hip thrust barbell',rep:'10',rest:'90 sn',min:6,hv:'8',cap3:true},
  {tip:'t',ex:'Seated calf raise',rep:'12-15',rest:'45 sn',min:2.5},
  {tip:'ss',ex:'Core süperset',det:'Bench leg raise x12-15 + bicycle crunch x15/yan',rep:'3 tur',rest:'45 sn',min:5.5},
  {tip:'int',ex:'İntervaller',det:'İp 30 sn / 30 sn dinlen x8',min:8}
 ]}
};

const WARM=['2 dk bike veya ip, hafif','Cat-cow x8','Göğüs kafesi rotasyonu x6/yan','Band pull-apart x15','Scapular push-up x10','Glute bridge x12','Sopa ile kalça menteşesi x10'];
const WARM_LOWER=['Bacak sallama x10/yan','Vücut ağırlığı goblet squat x10'];
const COOL=['Kapı veya rig göğüs germe 40 sn/yan','Rig lat germe 40 sn/yan','Child\'s pose 60 sn','Kalça fleksör germe 40 sn/yan','Hamstring germe 40 sn/yan','Sırtüstü 90/90 nefes 2 dk'];

/* ---------- HAFTA KOMBİNASYONLARI ---------- */
const COMBOS={
 '3G1V1R':{lab:'3 gym + 1 VO2 + 1 koşu',days:['G','R','G','o','G','V','o']},
 '4G1R':{lab:'4 gym + 1 koşu',days:['G','G','o','G','R','G','o']},
 '4G1V':{lab:'4 gym + 1 VO2',days:['G','G','o','G','V','G','o']},
 '3G2R':{lab:'3 gym + 2 koşu',days:['G','R','G','o','G','R','o']},
 '3G2V':{lab:'3 gym + 2 VO2',days:['G','V','G','o','G','V','o']},
 '3G1V':{lab:'3 gym + 1 VO2 (yoğun hafta)',days:['G','o','G','V','o','G','o']}
};
const ORDER=['UA','LA','UB','LB'];
let gymPtr=0; // sıradaki gym seansı

/* ---------- RENDER ---------- */
function setWeek(w){week=Math.min(16,Math.max(1,w));done={};render();}
function go(t){tab=t;render();}
function phaseSets(row,ph){
  if(row.tip==='bb'){const st=row.cap3?Math.min(ph.bb,3):ph.bb;return {sets:st,rep:(ph.heavy&&row.hv)?row.hv:row.rep};}
  if(row.tip==='t') return {sets:ph.t,rep:ph.heavy?'6-10':row.rep};
  if(row.tip==='circ') return {sets:ph.circ,rep:null};
  if(row.tip==='ss') return {sets:row.t?ph.t:(ph.deload?2:3),rep:null};
  return {sets:null,rep:row.rep};
}
function rowMin(row,ph){
  const base=row.min;
  if(row.tip==='bb'){const st=row.cap3?Math.min(ph.bb,3):ph.bb;return base*(st/3);}
  if(row.tip==='t') return base*(ph.t/2);
  if(row.tip==='circ') return base*(ph.circ/3);
  if(row.tip==='int') return ph.deload?base/2:base;
  if(row.tip==='ss') return row.t?base*(ph.t/2):(ph.deload?base*2/3:base);
  return ph.deload?base*0.6:base;
}
function renderHeader(){
  const ph=phase(week);
  document.getElementById('wkNum').textContent='Hafta '+week;
  document.getElementById('wkPhase').textContent=ph.name;
  document.getElementById('segs').innerHTML=Array.from({length:16},(_,i)=>{
    const w=i+1;let c=w<week?'on':'';if(DELOAD.includes(w))c+=' dl';if(w===week)c+=' cur';return `<i class="${c}"></i>`;}).join('');
}
function render(){
  renderHeader();
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const m=document.getElementById('main');
  if(tab==='hafta') m.innerHTML=viewHafta();
  else if(tab==='seans') m.innerHTML=viewSeans();
  else if(tab==='kural') m.innerHTML=viewKural();
  else if(tab==='besin') m.innerHTML=viewBesin();
  else if(tab==='test') m.innerHTML=viewTest();
  else m.innerHTML=viewYol();
  window.scrollTo(0,0);
}

function viewHafta(){
  const ph=phase(week);
  const c=COMBOS[combo];
  const names=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  let ptr=gymPtr;
  const cells=c.days.map((d,i)=>{
    let cls='o',txt='Dinlen';
    if(d==='G'){cls='g';const k=ORDER[ptr%4];txt=S[k].name;ptr++;}
    if(d==='V'){cls='v';txt='VO2';}
    if(d==='R'){cls='r';txt='Koşu';}
    return `<div class="day ${cls}"><small>${names[i]}</small><b>${txt}</b></div>`;
  }).join('');
  const nextGym=S[ORDER[gymPtr%4]].name;
  return `
  <h1>Bu hafta</h1>
  <p>${ph.name}. ${ph.deload?'Hafif hafta: barbell 2 set, tükenme setleri 1, kondisyon yarım. Bu haftanın işi test.':ph.peak?'Ağırlıklar en yüksek, tekrarlar düşük. Kondisyon kısa ve sert.':ph.heavy?'Barbell tekrarları düşüyor, ağırlık yükseliyor.':'Barbell '+ph.bb+' set, tükenme hareketleri '+ph.t+' set, devreler '+ph.circ+' tur.'}</p>
  <h2>Kombinasyon</h2>
  <div class="sel">${Object.keys(COMBOS).map(k=>`<button class="${k===combo?'on':''}" onclick="combo='${k}';render()">${COMBOS[k].lab}</button>`).join('')}</div>
  <div class="grid">${cells}</div>
  <p class="hint">Günler örnek diziliş. Yer değiştirirken tek kural: Lower gününün ertesine VO2 veya koşu koyma. Aynı gün sabah koşu akşam gym olabilir.</p>
  <div class="card">
    <div class="head"><b>Sıradaki gym seansı: ${nextGym}</b></div>
    <p>Gym seansları her zaman Upper A, Lower A, Upper B, Lower B sırasıyla döner. 3 gym yaptığın haftada kalan seans sonraki haftaya sarkar, hiçbir kas grubu atlanmaz.</p>
    <button class="big" onclick="session=ORDER[gymPtr%4];tab='seans';render()">Bu seansı aç</button>
    <button class="big" onclick="gymPtr++;render()">Seansı yaptım, sıradakine geç</button>
  </div>
  <div class="card tint">
    <b>Bu haftanın kardiyosu</b>
    <p><b style="color:var(--rose)">VO2</b> ${week%2===1?'(bike haftası)':'(koşu haftası)'}: ${ph.vo2}</p>
    <p><b style="color:var(--sage)">Koşu</b>: ${ph.run}</p>
  </div>`;
}

function exerciseRows(k){
  const ph=phase(week);
  let total=0;
  const rows=S[k].rows.map((r,i)=>{
    const ps=phaseSets(r,ph);const mn=rowMin(r,ph);total+=mn;
    const id=k+i;const isDone=done[id];
    let main='',sub='';
    if(r.tip==='bb'){main=`${r.ex}`;sub=`${ps.sets} x ${ps.rep}, ${r.rest} ara, 1-2 tekrar cepte`;}
    else if(r.tip==='t'){main=`${r.ex}<span class="chip">T</span>`;sub=`${ps.sets} x ${ps.rep} tükenmeye, ${r.rest}`;}
    else if(r.tip==='circ'){main=`${r.ex}<span class="chip g">devre</span>`;sub=`${r.det}. ${ps.sets} tur, ${r.rest}`;}
    else if(r.tip==='ss'){main=`${r.ex}${r.t?'<span class="chip">T</span>':''}`;sub=`${r.det}. ${ps.sets} tur, ${r.rest}`;}
    else if(r.tip==='int'){main=`${r.ex}<span class="chip b">interval</span>`;sub=ph.deload?r.det.replace(/x\d+/,m=>'x'+Math.ceil(parseInt(m.slice(1))/2)):r.det;}
    else{main=r.ex;sub=`${r.rep}, ${r.rest}`+(r.note?'. '+r.note:'');}
    return `<div class="row ${isDone?'done':''}" onclick="done['${id}']=!done['${id}'];render()"><div class="n">${i+1}</div><div class="t"><b>${main}</b><span>${sub}</span></div><div class="m">~${mn%1?mn.toFixed(1):mn} dk</div></div>`;
  }).join('');
  return {rows,total};
}

function viewSeans(){
  const ph=phase(week);
  const tabs=`<div class="sel">${ORDER.map(k=>`<button class="${k===session?'on':''}" onclick="session='${k}';render()">${S[k].name}</button>`).join('')}<button class="${session==='VO2'?'on':''}" onclick="session='VO2';render()">VO2</button><button class="${session==='RUN'?'on':''}" onclick="session='RUN';render()">Koşu</button></div>`;
  if(session==='VO2'){
    const bike=week%2===1;
    return `<h1>VO2 seansı</h1>${tabs}
    <div class="card"><b>Hafta ${week}: ${bike?'spin bike':'koşu'}</b>
    <p class="ink">Isınma 7 dk hafif.</p>
    <p class="ink">Ana bölüm: ${ph.vo2}. Sert bloklar nabız 155-162, konuşamayacak seviye. Aralar çok hafif, tamamen toparlan.</p>
    <p class="ink">Soğuma 7 dk.</p>
    <p class="hint">Tek ve çift haftalar dönüşümlü: tek hafta bike, çift hafta koşu. ${bike?'':'Koşu haftasında sert blokları sahilde düz yerde yap, ilk bloğu biraz yavaş aç.'}</p></div>`;
  }
  if(session==='RUN'){
    return `<h1>Koşu seansı</h1>${tabs}
    <div class="card"><b>Hafta ${week}</b>
    <p class="ink">5 dk yürüyüş, sonra: ${ph.run}. Bitirince 5 dk yürüyüş.</p>
    <p class="ink">Nabız tavanı 150. İlk kilometreyi bilerek yavaş aç, nabzın kaymasının sebebi hızlı açılış.</p>
    <p class="hint">Koşu hattı: 10/1 → 12/1 → 15/1 → devamlı 30 → 45 dk → tempo blokları. Nefes rahat değilse blok süresini artırma, bir hafta daha aynı kal.</p></div>`;
  }
  const {rows,total}=exerciseRows(session);
  const lower=session[0]==='L';
  return `<h1>${S[session].name}</h1><p>${S[session].sub}</p>${tabs}
  <details><summary>Isınma, 7 dk</summary><ul class="warm">${WARM.concat(lower?WARM_LOWER:[]).map(x=>`<li>${x}</li>`).join('')}</ul></details>
  <div class="card">${rows}<div class="sum"><span>Net iş</span><b>~${Math.round(total)} dk</b></div><div class="sum" style="border:0;padding-top:4px"><span>Isınma + soğuma dahil</span><b>~${Math.round(total)+14} dk</b></div></div>
  <details><summary>Soğuma, 7 dk</summary><ul class="warm">${COOL.map(x=>`<li>${x}</li>`).join('')}</ul></details>
  <p class="hint">Satıra dokununca işaretlenir. Sayfa kapanınca işaretler sıfırlanır, ağırlıkları kendi takibinde tut.</p>`;
}

    body=`<div class="card"><p class="ink">Isınma 4 dk (ip hafif + mobilite).</p><p class="ink">6 x (ip 1 dk sert / 1 dk yürüme). Sert bloklar konuşamayacak seviye.</p><p class="ink">Soğuma 4 dk.</p><p class="hint">Ana plandaki VO2 seansının yol karşılığı. Koşu seansı yolda da aynen yapılır.</p></div>`;

    body=`<div class="card">${y.rows.map((r,i)=>{const id='y'+yol+i;return `<div class="row ${done[id]?'done':''}" onclick="done['${id}']=!done['${id}'];render()"><div class="n">${i+1}</div><div class="t"><b>${r[0]}</b></div><div class="m">${r[1]}</div></div>`}).join('')}<div class="sum"><span>3 tur, tur arası 60 sn</span><b>~15 dk</b></div><div class="sum" style="border:0;padding-top:4px"><span>Isınma + soğuma dahil</span><b>~22 dk</b></div></div><p class="hint">Zaman varsa 4. tur. Tükenme yok, form temiz, amaç kayıp önlemek. C1 ve C2 dönüşümlü.</p>`;
  } else {
    let tot=0;
    body=`<div class="card">${y.rows.map((r,i)=>{tot+=r[2];const id='y'+yol+i;return `<div class="row ${done[id]?'done':''}" onclick="done['${id}']=!done['${id}'];render()"><div class="n">${i+1}</div><div class="t"><b>${r[0]}</b><span>${r[1]}</span></div><div class="m">~${r[2]} dk</div></div>`}).join('')}<div class="sum"><span>Net iş</span><b>~${Math.round(tot)} dk</b></div><div class="sum" style="border:0;padding-top:4px"><span>Isınma + soğuma dahil</span><b>~${Math.round(tot)+8} dk</b></div></div>`;
