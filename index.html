<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hibrit">
<title>Hibrit Plan Nisan 2027</title>
<style>
:root{
  --bg:#1c2230;--surf:#273040;--surf2:#303a4d;--line:#3a4558;
  --ink:#ede9e0;--ink2:#a9b1c2;--mute:#6f7a8f;
  --amber:#f2b33d;--sage:#8fc7a3;--rose:#e58a8a;--sky:#7fb3e6;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.wkbar{display:flex;align-items:center;gap:10px}
.wkbar button{background:var(--surf);border:0;color:var(--ink);font-size:22px;width:40px;height:40px;border-radius:10px}
.wkbar .lab{flex:1;text-align:center}
.wkbar .lab b{font-size:20px;font-variant-numeric:tabular-nums}
.wkbar .lab small{display:block;color:var(--ink2);font-size:13px}
.segs{display:flex;gap:3px;margin-top:8px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--amber)}
.segs i.dl{background:var(--sky)}
.segs i.tr{background:var(--rose)}
.segs{gap:2px}
.banner{background:rgba(229,138,138,.14);border:1px solid rgba(229,138,138,.4);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.banner b{color:var(--rose)}
.wkbar .lab .today{background:none;border:0;color:var(--amber);font-size:13px;font-family:inherit;padding:4px 8px 0;width:auto;height:auto;border-radius:0}
.segs i.cur{outline:2px solid var(--ink);outline-offset:1px}
main{padding:14px 16px 20px;max-width:560px;margin:0 auto}
h1{font-size:24px;font-weight:700;margin:6px 0 4px;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:22px 0 8px}
p{margin:6px 0;color:var(--ink2)}
p.ink{color:var(--ink)}
.card{background:var(--surf);border-radius:var(--r);padding:14px;margin:10px 0}
.card.tint{background:var(--surf2)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .n{width:22px;flex:none;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:2px}
.row .t{flex:1}
.row .t b{display:block;font-weight:600}
.row .t span{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.row .m{flex:none;text-align:right;color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums;padding-top:2px}
.row.done .t b{color:var(--mute);text-decoration:line-through}
.row .t b .chip,.chip{display:inline-block;margin-top:0;background:rgba(242,179,61,.15);color:var(--amber);font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.row .t b .chip.b,.chip.b{background:rgba(127,179,230,.15);color:var(--sky)}
.row .t b .chip.g,.chip.g{background:rgba(143,199,163,.15);color:var(--sage)}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--surf2);color:var(--ink2);font-size:13px;margin:2px 4px 2px 0}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font-size:11px;padding:6px 0 2px;font-family:inherit}
.tabs button.on{color:var(--amber)}
.tabs button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.day{background:var(--surf2);border-radius:10px;padding:8px 2px;text-align:center;min-height:62px}
.day small{display:block;color:var(--mute);font-size:11px;margin-bottom:4px}
.day b{font-size:13px;display:block;line-height:1.15}
.day.g b{color:var(--amber)}.day.v b{color:var(--rose)}.day.r b{color:var(--sage)}.day.o b{color:var(--mute);font-weight:400}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sel button{background:var(--surf);border:1px solid var(--line);color:var(--ink2);padding:9px 12px;border-radius:10px;font-size:14px;font-family:inherit}
.sel button.on{background:var(--amber);color:#1c2230;border-color:var(--amber);font-weight:700}
.big{background:var(--surf);border:1px solid var(--line);color:var(--ink);padding:12px;border-radius:12px;font-size:15px;width:100%;font-family:inherit;margin:8px 0}
.warm{font-size:15px}
.warm li{margin:4px 0;color:var(--ink2)}
ul{padding-left:18px;margin:6px 0}
li{margin:5px 0;color:var(--ink2)}
li b{color:var(--ink);font-weight:600}
.sum{display:flex;justify-content:space-between;color:var(--ink2);font-size:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:baseline}
.head small{color:var(--sage)}
details{margin:8px 0}
summary{cursor:pointer;color:var(--ink);font-weight:600;padding:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;border-top:0}
td{color:var(--ink2)}td:first-child{color:var(--ink)}
.hint{font-size:13px;color:var(--mute)}

.big.pri{background:var(--amber);color:#1c2230;border-color:var(--amber);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.opt{background:var(--surf);border:1px solid var(--line);color:var(--ink);padding:14px 10px;border-radius:12px;font-size:15px;font-family:inherit;font-weight:600;text-align:left}
.opt small{display:block;color:var(--amber);font-weight:400;font-size:12px;margin-top:2px}
.opt.nx{border-color:var(--amber)}
.opt.dn{color:var(--sage);display:flex;flex-direction:column}.opt.dn small{color:var(--mute)}
.lrow{padding:14px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0;padding-top:2px}
.lrow>b{display:block;font-weight:600}
.lrow .sub{display:block;color:var(--ink2);font-size:14px;margin:2px 0 6px}
.lrow.tap{display:flex;gap:10px;align-items:center;cursor:pointer}
.lrow.tap .t{flex:1}.lrow.tap .t b{display:block;font-weight:600}.lrow.tap .t span{display:block;color:var(--ink2);font-size:14px}
.lrow.ok .t b{color:var(--sage)}
.lrow.tap .t b .chip{display:inline-block;margin-top:0}
.ck{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--sage);font-weight:700;flex:none}
.mv{margin-top:10px;font-weight:600;color:var(--ink)}.mv small{color:var(--mute);font-weight:400}
.sg{color:var(--amber);font-weight:600}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.set{display:flex;align-items:center;gap:4px;background:var(--surf2);border-radius:10px;padding:4px 6px}
.set span{color:var(--mute);font-size:13px;min-width:14px;text-align:center}
.set input{width:58px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 6px;font-size:16px;font-family:inherit;text-align:center}
.set.wide{flex:1 1 140px}.set.wide input{flex:1;width:auto}.set.wide span{min-width:64px;text-align:left}
.set.date{margin:10px 0;max-width:260px}
.note{width:100%;min-height:64px;background:var(--surf);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font-size:16px;font-family:inherit;margin:8px 0}
.drow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.drow:first-of-type{border-top:0}
.drow span{color:var(--ink2);flex:none;min-width:96px}
.drow b{flex:1;font-weight:600}.drow b small{color:var(--mute);font-weight:400}
.drow.col{flex-direction:column;gap:2px}.drow.col span{min-width:0}
.del{background:none;border:0;color:var(--mute);font-size:16px;padding:0 4px;font-family:inherit}
.toast{background:rgba(143,199,163,.15);color:var(--sage);border-radius:10px;padding:10px 12px;margin:6px 0 4px;font-weight:600}
.banner .big{margin-bottom:0}
</style>
</head>
<body>
<header>
  <div class="wkbar">
    <button onclick="setWeek(week-1)">‹</button>
    <div class="lab"><b id="wkNum">Hafta 1</b><small id="wkPhase"></small><button class="today" onclick="setWeek(todayWeek())">Bugüne git</button></div>
    <button onclick="setWeek(week+1)">›</button>
  </div>
  <div class="segs" id="segs"></div>
</header>
<main id="main"></main>
<nav class="tabs">
  <button data-t="hafta" onclick="go('hafta')"><i>▦</i>Hafta</button>
  <button data-t="seans" onclick="go('seans')"><i>▲</i>Seans</button>
  <button data-t="yol" onclick="go('yol')"><i>✈</i>Yol</button>
  <button data-t="gecmis" onclick="go('gecmis')"><i>↻</i>Geçmiş</button>
  <button data-t="test" onclick="go('test')"><i>◎</i>Testler</button>
  <button data-t="kural" onclick="go('kural')"><i>≡</i>Kurallar</button>
</nav>

<script>
/* ---------- STATE ---------- */
const START=new Date(2026,8,28), NW=31;
function todayWeek(){const d=Math.floor((new Date()-START)/864e5);return Math.min(NW,Math.max(1,Math.floor(d/7)+1));}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
let week=todayWeek(), tab='hafta', combo=ls('combo')||'3G1V1R', session='UA', done={};
let gymPtr=parseInt(ls('gymPtr')||'0',10)||0;
const MON=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function wkRange(w){const a=new Date(START);a.setDate(a.getDate()+7*(w-1));const b=new Date(a);b.setDate(b.getDate()+(w===NW?4:6));
  const f=d=>d.getDate()+' '+MON[d.getMonth()];return f(a)+' - '+f(b);}

/* ---------- 31 HAFTA ---------- */
const BL={
 adapt1:{blk:'Adaptasyon 1',bb:2,rir:'3 tekrar cepte',t:1,tFail:false,circ:2,light:true,mode:'vol',note:'Ağırlıkları hafif seç, hareketleri ve süreyi oturt. T hareketleri tükenmeye değil, 2 tekrar cepte. VO2 yok.'},
 adapt2:{blk:'Adaptasyon 2',bb:3,rir:'2 tekrar cepte',t:2,tFail:true,circ:3,mode:'vol',note:'Tam seans ilk kez. Barbell 3 set, T hareketleri 2 set tükenmeye. Bu hafta çalışma ağırlıklarını bul.'},
 vol1:{blk:'Blok 1 Hacim',bb:3,rir:'1-2 tekrar cepte',t:2,tFail:true,circ:3,mode:'vol',note:'Barbell 3 set, her hafta ağırlık artışı hedef. İlerleme kuralı devrede.'},
 vol2:{blk:'Blok 2 Hacim',bb:4,rir:'1-2 tekrar cepte',t:2,tFail:true,circ:3,mode:'vol',note:'Ana barbell hareketlerine 4. set eklendi (bench, squat, shoulder press, RDL).'},
 int1:{blk:'Blok 3 Yoğunluk',bb:4,rir:'1-2 tekrar cepte',t:2,tFail:true,circ:3,mode:'int',note:'Tekrarlar düşüyor, ağırlık yükseliyor. Devreler 3 tur, kısa ve sert.'},
 int2:{blk:'Blok 4 Yoğunluk 2',bb:4,rir:'1-2 tekrar cepte',t:2,tFail:true,circ:3,mode:'int',note:'Yoğunluk devam. Koşu uzun koşu tarafına kayıyor.'},
 peak:{blk:'Blok 5 Zirve',bb:4,rir:'1 tekrar cepte',t:2,tFail:true,circ:3,mode:'peak',note:'Ağırlıklar en yüksek, tekrarlar en düşük. Toparlanmaya dikkat, recovery kırmızıysa sert seansı kaydır.'},
 fin:{blk:'Blok 6 Final',bb:3,rir:'1-2 tekrar cepte',t:2,tFail:true,circ:3,mode:'int',runFirst:true,note:'Barbell bilerek 3 sete indi, ağırlık korunuyor. Öncelik koşu, bacaklar 10K için taze kalsın.'},
 dl:{blk:'Deload + test',bb:2,rir:'2-3 tekrar cepte',t:1,tFail:true,circ:2,light:true,mode:'vol',deload:true,note:'Hafif hafta: ağırlıklar aynı, hacim yarım. Bu haftanın işi test, bkz. Testler.'},
 tr:{blk:'Seyahat',bb:2,rir:'2-3 tekrar cepte',t:1,tFail:true,circ:2,light:true,mode:'vol',travel:true,note:'Yol sekmesindeki planlar. Haftada en az 2 seans. Otelde salon varsa ana plan, deload setleriyle.'}
};
const PLAN=[null,
 ['adapt1','10 dk koşu / 1 dk yürüyüş x3',null,null],
 ['adapt1','10 dk koşu / 1 dk yürüyüş x3',null,null,{label:'Adaptasyon 1 (tekrar)'}],
 ['adapt2','12 dk koşu / 1 dk yürüyüş x3','4x3 dk','4x3 dk'],
 ['vol1','15 dk koşu / 1 dk yürüyüş x2, sonra 5 dk koşu','4x4 dk','4x4 dk'],
 ['vol1','Devamlı 20 dk, 1 dk yürüyüş, 10 dk koşu','4x4 dk','4x4 dk'],
 ['vol1','Devamlı 25 dk','5x4 dk','5x4 dk'],
 ['tr','Kolay 20-25 dk (yolda da olur)','ip','ip',{trip:'8-15 Kasım seyahati',test:'Yolda max şınav testi'}],
 ['vol2','Devamlı 30 dk','5x4 dk','5x4 dk'],
 ['vol2','Devamlı 30 dk','5x4 dk','5x4 dk'],
 ['vol2','Devamlı 35 dk','6x4 dk','6x4 dk'],
 ['vol2','Devamlı 35 dk','6x4 dk','6x4 dk'],
 ['dl','Kolay 20 dk, ayrı günde 5K test (durmadan)','3x3 dk hafif','3x3 dk hafif',{test:'Şınav, barfiks denemesi, 5K durmadan'}],
 ['int1','Devamlı 35 dk','5x4 dk veya 2 x Tabata','30 sn sert / 30 sn hafif x14'],
 ['int1','Devamlı 40 dk','5x4 dk veya 2 x Tabata','30 sn sert / 30 sn hafif x16'],
 ['int1','Devamlı 40 dk','5x4 dk veya 2 x Tabata','30 sn sert / 30 sn hafif x18'],
 ['dl','Kolay 25 dk, ayrı günde 5K zaman testi','3x3 dk hafif','3x3 dk hafif',{test:'Şınav, barfiks, 5K zaman, VO2 max'}],
 ['int2','Devamlı 45 dk','6x3 dk sert veya 2 x Tabata','4x800 m, arada 2 dk yürüyüş'],
 ['int2','Devamlı 45 dk','6x3 dk sert veya 2 x Tabata','5x800 m, arada 2 dk yürüyüş'],
 ['int2','Devamlı 50 dk','6x3 dk sert veya 2 x Tabata','6x800 m, arada 2 dk yürüyüş'],
 ['tr','Kolay 30 dk','3x3 dk hafif (8-11 Şub)','3x3 dk hafif (8-11 Şub)',{trip:'12-20 Şubat seyahati',home:'8-11 Şubat evdesin: 2 gym seansı deload setleriyle, 12 Şubat itibarıyla Yol.'}],
 ['tr','Kolay 25-30 dk (yolda)','ip','ip',{trip:'12-20 Şubat seyahati'}],
 ['peak','Devamlı 50 dk','5x4 dk, son blok en sert','4x1 km tempo, arada 90 sn'],
 ['peak','Devamlı 55 dk','5x4 dk, son blok en sert','5x1 km tempo, arada 90 sn'],
 ['peak','Devamlı 55 dk, son 10 dk tempo','5x4 dk, son blok en sert','5x1 km tempo, arada 90 sn'],
 ['tr','Kolay 30 dk (evde veya yolda)','3x3 dk hafif (15-17 Mar)','3x3 dk hafif (15-17 Mar)',{trip:'18-21 Mart seyahati',home:'15-17 Mart evdesin: 2 gym seansı deload setleriyle, 18 Mart itibarıyla Yol. Şınav testini otelde yap.',test:'Otelde max şınav testi'}],
 ['peak','Devamlı 60 dk','Bu hafta VO2 yerine 5K zaman testi','Bu hafta VO2 yerine 5K zaman testi',{test:'Pazartesi-Salı barfiks ve 5K zaman testi, WHOOP VO2 max. Sonra normal zirve haftası'}],
 ['fin','Devamlı 65 dk','4x4 dk (koruma)','3x2 km tempo, arada 2 dk'],
 ['fin','Devamlı 70 dk, rahat tempo (en uzun koşu)','4x4 dk (koruma)','3x2 km tempo, arada 2 dk'],
 ['tr','Kolay 40-45 dk (yolda da olur)','ip','ip',{trip:'14-18 Nisan seyahati',home:'12-13 Nisan evdesin: 1-2 gym seansı hafif setlerle, 14 Nisan itibarıyla Yol.'}],
 ['fin','Kolay 40 dk + 4 x 1 dk hızlanma (10K öncesi dinlen)','3x3 dk hafif','3x3 dk hafif'],
 ['dl','10K deneme, durmadan','Yok, yerine test','Yok, yerine test',{test:'Final: 10K, şınav, barfiks, 5 tekrar max'}]
];
const IPVO2='Yolda ip: 6 x (1 dk sert / 1 dk yürüme), opsiyonel';
function phase(w){
  const r=PLAN[w];const b=BL[r[0]];const x=r[4]||{};
  const bike=w%2===1;let vo2=bike?r[2]:r[3];if(vo2==='ip')vo2=IPVO2;
  return Object.assign({},b,{run:r[1],vo2,bike,vo2Off:!r[2],trip:x.trip,test:x.test,home:x.home,
    name:(x.trip?'Seyahat':(x.label||b.blk)),tabataOk:w>=13&&bike&&/Tabata/.test(r[2]||'')});
}
const TABATA='Tabata: 20 sn tam gaz / 10 sn dinlenme x8 (4 dk). 2 kez, arada 4 dk çok hafif pedal. 20 saniyeler gerçekten tavan, 4. turdan sonra bitmiş hissetmelisin.';
const EMOM='Opsiyonel EMOM (10 dk, interval yerine): tek dakikalar 15 KB swing 16 kg, çift dakikalar 8 burpee. Dakika dolmadan bitir, kalan süre dinlenme.';

/* ---------- SEANSLAR ---------- */
/* tip: bb = barbell bileşik (blok setine göre), t = tükenme, fx = sabit, circ = devre, ss = süperset, int = interval */
const S={
 UA:{name:'Upper A',sub:'Yatay itme + çekme',rows:[
  {tip:'bb',ex:'Barbell bench press',rep:'8-10',rest:'90 sn',min:6.5,hv:'6-8',pk:'5-6'},
  {tip:'t',ex:'Seated cable row',rep:'8-12',rest:'75 sn',min:3.5},
  {tip:'circ',ex:'Devre 1',det:'KB swing 16 kg x15 + ip 40 sn',rest:'tur arası 45 sn',min:5.5},
  {tip:'t',ex:'Incline DB press',rep:'8-12',rest:'75 sn',min:3.5},
  {tip:'fx',ex:'Bantlı barfiks',rep:'3 x max (hedef 5-8)',rest:'90 sn',min:5.5,note:'Progresyon: bant hafifledikçe ilerle'},
  {tip:'t',ex:'DB tek kol row',rep:'8-12',rest:'60 sn',min:3.5},
  {tip:'t',ex:'DB shrug',rep:'12-15',rest:'45 sn',min:2.5},
  {tip:'ss',ex:'Süperset',det:'DB lateral raise x12 + face pull x15',rep:'2 tur',rest:'60 sn',min:4.5,t:true},
  {tip:'ss',ex:'Süperset',det:'Triceps pushdown x12 + hammer curl x12',rep:'2 tur',rest:'60 sn',min:4.5,t:true},
  {tip:'int',ex:'İntervaller',det:'Spin bike 20 sn sert / 40 sn hafif x6',min:6}
 ]},
 LA:{name:'Lower A',sub:'Squat ağırlıklı',rows:[
  {tip:'bb',ex:'Barbell back squat',rep:'6-8',rest:'120 sn',min:8,hv:'5-6',pk:'4-5'},
  {tip:'t',ex:'Leg press',rep:'8-12',rest:'90 sn',min:4},
  {tip:'circ',ex:'Devre 1',det:'Goblet squat 20 kg x10 + burpee x6',rest:'tur arası 45 sn',min:5.5},
  {tip:'t',ex:'Leg curl',rep:'10-12',rest:'60 sn',min:3},
  {tip:'bb',ex:'DB walking lunge',rep:'10/bacak',rest:'75 sn',min:6,hv:'8/bacak',pk:'8/bacak',cap3:true},
  {tip:'t',ex:'Standing calf raise',rep:'12-15',rest:'45 sn',min:2.5},
  {tip:'ss',ex:'Core süperset',det:'Kablo crunch x12-15 + plank 40 sn',rep:'3 tur',rest:'45 sn',min:6},
  {tip:'fx',ex:"Farmer's carry",rep:'3 x 40 m, 2x20 kg KB',rest:'60 sn',min:4},
  {tip:'int',ex:'İntervaller',det:'İp 30 sn / 30 sn dinlen x8',min:8}
 ]},
 UB:{name:'Upper B',sub:'Dikey itme + çekme',rows:[
  {tip:'bb',ex:'Makine shoulder press',rep:'8-10',rest:'90 sn',min:6.5,hv:'6-8',pk:'6-8'},
  {tip:'t',ex:'Lat pulldown',rep:'8-12',rest:'75 sn',min:3.5},
  {tip:'circ',ex:'Devre 1',det:'Spin bike 30 sn sert + KB swing 16 kg x12',rest:'tur arası 45 sn',min:5},
  {tip:'fx',ex:'Negatif barfiks',rep:'3 x 4 (5 sn iniş)',rest:'90 sn',min:4.5,note:'Sandalyeden çık, kontrollü in'},
  {tip:'t',ex:'Chest press makinesi',rep:'8-12',rest:'75 sn',min:3.5},

function setWeek(w){week=Math.min(NW,Math.max(1,w));done={};render();}
function go(t){tab=t;armed=null;render();}
function repFor(row,ph){if(ph.mode==='peak'&&row.pk)return row.pk;if(ph.mode!=='vol'&&row.hv)return row.hv;return row.rep;}
function phaseSets(row,ph){
  if(row.tip==='bb'){const st=row.cap3?Math.min(ph.bb,3):ph.bb;return {sets:st,rep:repFor(row,ph)};}
  if(row.tip==='t') return {sets:ph.t,rep:ph.mode==='vol'?row.rep:'6-10'};
  if(row.tip==='circ') return {sets:ph.circ,rep:null};
  if(row.tip==='ss') return {sets:row.t?ph.t:(ph.light?2:3),rep:null};
  return {sets:null,rep:row.rep};
}
function rowMin(row,ph){
  const base=row.min;
  if(row.tip==='bb'){const st=row.cap3?Math.min(ph.bb,3):ph.bb;return base*(st/3);}
  if(row.tip==='t') return base*(ph.t/2);
  if(row.tip==='circ') return base*(ph.circ/3);
  if(row.tip==='int') return ph.light?base/2:base;
  if(row.tip==='ss') return row.t?base*(ph.t/2):(ph.light?base*2/3:base);
  return ph.light?base*0.6:base;
}
function renderHeader(){
  const ph=phase(week);
  document.getElementById('wkNum').textContent='Hafta '+week+' / '+NW;
  document.getElementById('wkPhase').textContent=wkRange(week)+', '+ph.name;

    const w=i+1,p=phase(w);let c=w<week?'on':'';if(p.deload)c+=' dl';if(p.travel)c+=' tr';if(w===week)c+=' cur';return `<i class="${c}"></i>`;}).join('');
}
function render(keep){
  const y=window.scrollY||0;

}

function exerciseRows(k){
  const ph=phase(week);
  let total=0;
  const rows=S[k].rows.map((r,i)=>{
    const ps=phaseSets(r,ph);const mn=rowMin(r,ph);total+=mn;
    const id=k+i;const isDone=done[id];
    let main='',sub='';
    if(r.tip==='bb'){main=`${r.ex}`;sub=`${ps.sets} set x ${ps.rep}, ${r.rest} ara, ${ph.rir}`;}
    else if(r.tip==='t'){main=`${r.ex}<span class="chip">T</span>`;sub=`${ps.sets} set x ${ps.rep} ${ph.tFail?'tükenmeye':'2 tekrar cepte'}, ${r.rest}`;}
    else if(r.tip==='circ'){main=`${r.ex}<span class="chip g">devre</span>`;sub=`${r.det}. ${ps.sets} tur, ${r.rest}`;}
    else if(r.tip==='ss'){main=`${r.ex}${r.t?'<span class="chip">T</span>':''}`;sub=`${r.det}. ${ps.sets} tur, ${r.rest}`;}
    else if(r.tip==='int'){main=`${r.ex}<span class="chip b">interval</span>`;sub=ph.light?r.det.replace(/x\d+/,m=>'x'+Math.ceil(parseInt(m.slice(1))/2)):r.det;}
    else{main=r.ex;sub=`${r.rep}, ${r.rest}`+(r.note?'. '+r.note:'');}
    return `<div class="row ${isDone?'done':''}" onclick="done['${id}']=!done['${id}'];render(true)"><div class="n">${i+1}</div><div class="t"><b>${main}</b><span>${sub}</span></div><div class="m">~${mn%1?mn.toFixed(1):mn} dk</div></div>`;
  }).join('');
  return {rows,total};
}

const LKEY='hibrit_v1';
function loadDB(){try{const s=localStorage.getItem(LKEY);if(s){const d=JSON.parse(s);d.sessions=d.sessions||[];d.tests=d.tests||{};d.active=d.active||null;return d;}}catch(e){}return {sessions:[],tests:{},active:null};}
let DB=loadDB(), CUR=[], armed=null, msg='';
function save(){try{localStorage.setItem(LKEY,JSON.stringify(DB));}catch(e){}}
function iso(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekOf(s){const d=new Date(s+'T12:00:00');return Math.min(NW,Math.max(1,Math.floor((d-START)/864e5/7)+1));}
function wkStartIso(w){const a=new Date(START);a.setDate(a.getDate()+7*(w-1));return iso(a);}
const GUN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
function fmtD(s){const d=new Date(s+'T12:00:00');return d.getDate()+' '+MON[d.getMonth()];}
function fmtDay(s){const d=new Date(s+'T12:00:00');return GUN[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
const TYPES={UA:'Upper A',LA:'Lower A',UB:'Upper B',LB:'Lower B',VO2:'VO2',RUN:'Koşu',COND:'Kondisyon'};
function tName(t){if(t.startsWith('Y:'))return 'Yol '+Y[t.slice(2)].name;return TYPES[t]||t;}
function sorted(){return DB.sessions.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);}
function weekSessions(w){return sorted().filter(s=>weekOf(s.date)===w);}
function topRep(t){const n=(String(t||'').split('/')[0].match(/\d+/g)||[]).map(Number);return n.length?Math.max(...n):0;}
function lastOf(name){const l=sorted();for(let i=l.length-1;i>=0;i--){const e=l[i].ex&&l[i].ex[name];if(e&&e.s&&e.s.length)return Object.assign({date:l[i].date},e);}return null;}
const LOWER5=['Barbell back squat','Barbell RDL','Hip thrust barbell','Leg press'];
function suggest(name,cur,last){
  if(!last||!last.s.length)return '';
  const lt=topRep(last.t),ct=topRep(cur);
  if(lt&&ct&&ct<lt)return 'Tekrar aralığı düştü, bir kademe ağır başla';
  if(lt&&last.s.every(x=>(x.r||0)>=lt)){
    const inc=LOWER5.includes(name)?'+5 kg':(/Barbell|shoulder press/i.test(name)?'+2.5 kg':'bir kademe');
    return `Son seferde tüm setler ${lt} tekrar: ${inc} dene`;
  }
  return 'Aynı kiloda devam, tekrarı artır';
}
function movesOf(r){
  if(r.tip==='circ'||r.tip==='int')return null;
  if(r.tip==='ss'){
    return r.det.split(' + ').map(p=>{
      const tm=p.match(/x\s?([\d\-]+(\/\w+)?)/);
      const name=p.replace(/\s+x\s?[\d\-]+.*$/,'').replace(/\s+\d+\s*sn.*$/,'').trim();
      const nm=name.charAt(0).toUpperCase()+name.slice(1);
      let log='kgreps';
      if(/plank/i.test(nm))log='none'; else if(/leg raise|bicycle/i.test(nm))log='reps';
      return {name:nm,target:tm?tm[1]:'',log};
    });
  }
  if(r.tip==='fx'){
    if(/Bantlı/.test(r.ex))return [{name:r.ex,log:'band',target:'5-8'}];
    if(/Farmer/.test(r.ex))return [{name:r.ex,log:'kg1'}];
    return [{name:r.ex,log:'reps'}];
  }
  return [{name:r.ex,log:'kgreps'}];
}
function rowText(r,ph){
  const ps=phaseSets(r,ph);let main=r.ex,sub='';
  if(r.tip==='bb'){sub=`${ps.sets} set x ${ps.rep}, ${r.rest} ara, ${ph.rir}`;}
  else if(r.tip==='t'){main+='<span class="chip">T</span>';sub=`${ps.sets} set x ${ps.rep} ${ph.tFail?'tükenmeye':'2 tekrar cepte'}, ${r.rest}`;}
  else if(r.tip==='circ'){main+='<span class="chip g">devre</span>';sub=`${r.det}. ${ps.sets} tur, ${r.rest}`;}
  else if(r.tip==='ss'){main+=r.t?'<span class="chip">T</span>':'';sub=`${r.det}. ${ps.sets} tur, ${r.rest}`;}
  else if(r.tip==='int'){main+='<span class="chip b">interval</span>';sub=ph.light?r.det.replace(/x\d+/,m=>'x'+Math.ceil(parseInt(m.slice(1))/2)):r.det;}
  else{sub=`${r.rep}, ${r.rest}`+(r.note?'. '+r.note:'');}
  return {main,sub,ps};
}

function startS(t){
  const d=(week===todayWeek())?iso():wkStartIso(week);
  DB.active={type:t,date:d,ts:Date.now(),vals:{},checks:{},band:{},note:'',cardio:{}};

}
function sv(ci,i,f,v){const a=DB.active;const nm=CUR[ci].name;a.vals[nm]=a.vals[nm]||[];a.vals[nm][i]=a.vals[nm][i]||{};a.vals[nm][i][f]=v;save();}
function sb(ci,v){DB.active.band[CUR[ci].name]=v;save();}
function tick(i){DB.active.checks[i]=!DB.active.checks[i];save();render(true);}
function cset(f,v){DB.active.cardio[f]=v;save();}
function finishS(){
  const a=DB.active;const rec={type:a.type,date:a.date,ts:a.ts,ex:{},checks:a.checks,note:a.note,cardio:a.cardio};
  CUR.forEach(c=>{
    const v=(a.vals[c.name]||[]);const s=[];
    v.forEach(x=>{if(!x)return;const kg=parseFloat(String(x.kg||'').replace(',','.'));const r=parseInt(x.r,10);
      if(c.log==='kg1'){if(!isNaN(kg))s.push({kg});}
      else if(!isNaN(r))s.push(isNaN(kg)?{r}:{kg,r});});
    if(s.length||a.band[c.name])rec.ex[c.name]={t:c.target,s,band:a.band[c.name]||undefined};
  });
  DB.sessions.push(rec);DB.active=null;save();msg=tName(rec.type)+' kaydedildi';tab='hafta';week=weekOf(rec.date);render();
}
function cancelS(){if(armed==='cancel'){DB.active=null;armed=null;save();tab='hafta';}else armed='cancel';render(true);}
function delS(ts){if(armed===ts){DB.sessions=DB.sessions.filter(s=>s.ts!==ts);armed=null;save();}else armed=ts;render(true);}

function setInputs(ci,c,n,a){
  const v=a.vals[c.name]||[];let h='';
  if(c.log==='none')return '<p class="hint">Kayıt gerekmiyor.</p>';
  if(c.log==='kg1'){const x=v[0]||{};return `<div class="sets"><label class="set"><span>kg</span><input inputmode="decimal" placeholder="kg" value="${x.kg??''}" oninput="sv(${ci},0,'kg',this.value)"></label></div>`;}
  if(c.log==='band')h+=`<label class="set wide"><span>Bant</span><input placeholder="renk" value="${a.band[c.name]??''}" oninput="sb(${ci},this.value)"></label>`;
  for(let i=0;i<n;i++){const x=v[i]||{};
    h+=`<label class="set"><span>${i+1}</span>${c.log==='kgreps'?`<input inputmode="decimal" placeholder="kg" value="${x.kg??''}" oninput="sv(${ci},${i},'kg',this.value)">`:''}<input inputmode="numeric" placeholder="tkr" value="${x.r??''}" oninput="sv(${ci},${i},'r',this.value)"></label>`;}
  return `<div class="sets">${h}</div>`;
}
function lastLine(c){
  const l=lastOf(c.name);if(!l)return '<p class="hint">İlk kayıt.</p>';
  const s=l.s.map(x=>(x.kg!=null?x.kg+(x.r!=null?'×':' kg'):'')+(x.r!=null?x.r:'')).join(', ');
  const sg=c.log==='kgreps'?suggest(c.name,c.target,l):'';
  return `<p class="hint">Son ${fmtD(l.date)}: ${l.band?l.band+' bant, ':''}${s}${sg?`<br><b class="sg">${sg}</b>`:''}</p>`;
}
function logGym(a){
  const ph=phase(weekOf(a.date));CUR=[];let h='';
  S[a.type].rows.forEach((r,ri)=>{
    const {main,sub,ps}=rowText(r,ph);const mv=movesOf(r);
    if(!mv){const on=a.checks[ri];h+=`<div class="lrow tap ${on?'ok':''}" onclick="tick(${ri})"><div class="t"><b>${main}</b><span>${sub}</span></div><div class="ck">${on?'✓':''}</div></div>`;return;}
    h+=`<div class="lrow"><b>${main}</b><span class="sub">${sub}</span>`;
    mv.forEach(m=>{
      const ci=CUR.length;const target=m.target||ps.rep||'';const c={name:m.name,target,log:m.log};CUR.push(c);
      const n=r.tip==='fx'?(parseInt(r.rep)||3):(ps.sets||3);
      if(!a.vals[m.name]){const l=lastOf(m.name);a.vals[m.name]=[];if(l&&m.log==='kgreps'){for(let i=0;i<n;i++){const k=(l.s[i]||l.s[l.s.length-1]).kg;if(k!=null)a.vals[m.name][i]={kg:String(k)};}}
        if(l&&m.log==='kg1'&&l.s[0])a.vals[m.name][0]={kg:String(l.s[0].kg)};
        if(l&&m.log==='band'&&l.band)a.band[m.name]=l.band;}
      if(mv.length>1)h+=`<div class="mv">${m.name}${target?` <small>x${target}</small>`:''}</div>`;
      if(m.log!=='none')h+=lastLine(c);
      h+=setInputs(ci,c,n,a);
    });
    h+='</div>';
  });
  save();return h;
}
function logYol(a){

function comboFor(w){DB.combos=DB.combos||{};if(DB.combos[w]&&COMBOS[DB.combos[w]])return DB.combos[w];const p=phase(w);if(p.travel&&!p.home)return 'TRB';return ls('combo')&&COMBOS[ls('combo')]?ls('combo'):'3G1V1R';}
function setCombo(k){DB.combos=DB.combos||{};DB.combos[week]=k;if(!COMBOS[k].travel)ls('combo',k);save();render(true);}
function slotMeta(s,ph){
  if(s==='RUN2')return {t:'RUN',label:'Kolay koşu'};
  if(s==='RUN')return {t:'RUN',label:'Koşu'};
  if(s==='VO2')return ph.vo2Off?{t:'RUN',label:'Kolay koşu (VO2 yerine)'}:{t:'VO2',label:'VO2'};
  if(s==='Y:YV')return {t:s,label:'VO2 ip'};
  return {t:s,label:s.startsWith('Y:')?'Oda '+Y[s.slice(2)].name.replace('Hızlı ',''):tName(s)};
}
function slotsStatus(w){
  const ph=phase(w),c=COMBOS[comboFor(w)];const done=weekSessions(w).slice();const used=new Set();
  const list=c.slots.map(s=>{const m=slotMeta(s,ph);const i=done.findIndex((d,j)=>!used.has(j)&&d.type===m.t);if(i>=0)used.add(i);return Object.assign({},m,{done:i>=0?done[i]:null});});
  const extra=done.filter((d,j)=>!used.has(j));
  return {list,extra,c};
}

  ${msg?`<div class="toast">${msg}</div>`:''}
  <h2>Haftalar</h2>
  <div class="card">${weeks.map(w=>{const s=weekSessions(w);return `<div class="drow"><span>H${w} ${wkRange(w)}</span><b>${s.length?s.map(x=>tName(x.type).replace('Yol ','Y ')).join(', '):'-'}</b></div>`;}).join('')}</div>
  <h2>Hareketler</h2>
  <div class="card">${exHtml||'<p>Henüz kilo kaydı yok.</p>'}</div>
  <h2>Seanslar</h2>
  <div class="card">${l.length?l.slice().reverse().slice(0,40).map(s=>`<div class="drow"><span>${fmtDay(s.date)}</span><b>${tName(s.type)}${s.cardio&&(s.cardio.dk||s.cardio.km)?` <small>${s.cardio.dk?s.cardio.dk+' dk':''}${s.cardio.km?' '+s.cardio.km+' km':''}</small>`:''}</b><button class="del" onclick="delS(${s.ts})">${armed===s.ts?'Sil?':'×'}</button></div>`).join(''):'<p>Henüz kayıt yok.</p>'}</div>
  <h2>Yedek</h2>
  <p>Veriler sadece bu telefonda. Ayda bir yedek al: kopyala veya paylaş, Notlar'a ya da kendine mail at.</p>
  <button class="big" onclick="bkShare()">Yedeği paylaş</button>
  <button class="big" onclick="bkCopy()">Yedeği kopyala</button>
  <details><summary>Yedekten geri yükle</summary>
   <textarea id="bk" class="note" placeholder="Yedek metnini buraya yapıştır"></textarea>
   <button class="big" onclick="bkLoad()">Yedeği yükle</button>
   <p class="hint">Yüklenen yedek mevcut kayıtların yerine geçer.</p></details>`;
}
function bkCopy(){const t=JSON.stringify(DB);try{navigator.clipboard.writeText(t).then(()=>{msg='Yedek kopyalandı';render(true);},()=>{msg='Kopyalanamadı, paylaş düğmesini dene';render(true);});}catch(e){msg='Kopyalanamadı, paylaş düğmesini dene';render(true);}}
function bkShare(){const t=JSON.stringify(DB);if(navigator.share){navigator.share({title:'Hibrit yedek '+iso(),text:t}).catch(()=>{});}else bkCopy();}
function bkLoad(){try{const d=JSON.parse(document.getElementById('bk').value);if(!Array.isArray(d.sessions))throw 0;d.tests=d.tests||{};d.active=null;DB=d;save();msg='Yedek yüklendi: '+d.sessions.length+' seans';}catch(e){msg='Metin okunamadı, yedeğin tamamını yapıştır';}render();}

/* ---------- TESTLER ---------- */
const TESTS=[
 ['H7','H7, 9-15 Kas','Max şınav (yolda)','20 şınav'],
 ['H12','H12, 14-20 Ara','Max şınav, bantsız barfiks denemesi, 5K durmadan','22 şınav, barfiks çok yakın, 5K yürümeden'],
 ['H16','H16, 11-17 Oca','Max şınav, barfiks, 5K zaman, WHOOP VO2 max','24 şınav, 1 barfiks, 5K 34-35 dk, VO2 45'],
 ['H26','H25-26, 15-28 Mar','Şınav otelde (H25), barfiks ve 5K zaman 26. hafta başı','27 şınav, 2-3 barfiks, 5K 31-32 dk, VO2 46-47'],
 ['H31','H31, 26-30 Nis','10K durmadan, şınav, barfiks, 5 tekrar max (squat, bench, RDL)','10K yürümeden, 30 şınav, 4-5 barfiks, VO2 47-48']
];
const TF=[['sinav','Şınav'],['barfiks','Barfiks'],['kosu','Koşu süresi'],['vo2','VO2 max'],['kilo','Kilo'],['bel','Bel cm']];
function tset(k,f,v){DB.tests[k]=DB.tests[k]||{};DB.tests[k][f]=v;save();}
function viewTest(){
  return `<h1>Testler</h1>
  <p>Deload ve seyahat haftalarında, seanslardan ayrı bir günde. Şınav ve barfiks aynı gün, koşu testi ayrı gün. Kilo ve bel çevresini de aynı hafta ölç.</p>
  ${TESTS.map(t=>{const v=DB.tests[t[0]]||{};return `<div class="card"><div class="head"><b>${t[1]}</b></div><p class="ink">${t[2]}</p><p class="hint">Hedef: ${t[3]}</p>
   <div class="sets">${TF.map(f=>`<label class="set wide"><span>${f[1]}</span><input ${f[0]==='kosu'?'':'inputmode="decimal"'} placeholder="${f[0]==='kosu'?'dk:sn':'-'}" value="${v[f[0]]??''}" oninput="tset('${t[0]}','${f[0]}',this.value)"></label>`).join('')}</div></div>`;}).join('')}
  <h2>Başlangıç noktası (Eylül 2026)</h2>
  <div class="card tint">
   <span class="pill">15-20 şınav</span><span class="pill">0 barfiks</span><span class="pill">3-4 km devamlı koşu</span><span class="pill">7:15-8:15/km</span><span class="pill">VO2 max ~43</span><span class="pill">72 kg</span>
  </div>
  <p class="hint">Hedefler tahmini. Aralık testinden sonra gerçek sayılara göre güncellenir.</p>`;
}

/* ---------- SEYAHAT ---------- */
let yol='BUA';
const YWARM=['İp 1 dk hafif','Cat-cow x8','Göğüs kafesi rotasyonu x6/yan','Mavi bant pull-apart x15','Glute bridge x12'];
const YCOOL=['Kapı çerçevesinde göğüs germe 30 sn/yan','Child\'s pose 30 sn','Kalça fleksör germe 30 sn/yan','Hamstring germe 30 sn/yan'];
const Y={
 BUA:{name:'Upper A',sub:'Yatay itme + çekme, ~41 dk',rows:[
  ['Şınav','4 x max-2, 2 tekrar cepte, 75 sn',5.5],
  ['Oturarak bant row','Ayak altından. 3x12-15, 60 sn',4],
  ['Devre 1','İp 40 sn + bant deadlift (iki bant) x15. 3 tur, 45 sn',5],
  ['Ayak yükseltilmiş şınav','Sandalye veya yatak. 3x10-12, 60 sn',4],
  ['Tek kol bant row','Kapıdan veya masa ayağından. 3x12/kol, 45 sn',4.5],
  ['Süperset','Bant lateral raise x15 + kapıdan face pull x15. 2 tur, 45 sn',4],
  ['Süperset','Bant triceps pushdown x15 + bant curl x15. 2 tur, 45 sn',4],
  ['İntervaller','İp 30 sn / 30 sn x4',4]]},
 BLA:{name:'Lower A',sub:'Squat ağırlıklı, ~40 dk',rows:[
  ['Bulgarian split squat','Sandalye, sarı pilates bandı omuzda. 3x10/bacak, 60 sn',6],
  ['Bant squat','Tutmaçlı bant omuz hizasında. 3x15, 60 sn',4],
  ['Devre 1','Squat jump x8 + burpee x6. 3 tur, 45 sn',5],
  ['Nordic hamstring negatif','Ayaklar yatak altında. 3x5, 60 sn',3.5],
  ['Tek bacak glute bridge','3x12/bacak, 45 sn',4.5],
  ['Basamak calf raise','3x20, 30 sn',3],
  ['Core süperset','Reverse crunch x15 + plank 40 sn. 3 tur, 45 sn',5],
  ['İntervaller','İp 30/30 x4',4]]},
 BUB:{name:'Upper B',sub:'Dikey itme + çekme, ~40 dk',rows:[
  ['Pike şınav','Kalça yukarıda, omuz. 3x8-12, 60 sn',4],
  ['Kapı üstünden bant lat pulldown','Diz üstü oturarak. 3x12-15, 60 sn',4],
  ['Devre 1','İp 40 sn + mountain climber 30 sn. 3 tur, 45 sn',5],
  ['Dar şınav','Eller omuz içinde. 3 x max, 75 sn',4.5],
  ['Kapıdan bant yüksek row','Dirsekler yukarı, kapı göğüs hizası. 3x15, 45 sn',4],
  ['Süperset','Bant front raise x12 + kapıdan straight-arm pulldown x15. 2 tur, 45 sn',4],
  ['Süperset','Bant curl x15 + sandalye dips x12. 2 tur, 45 sn',4],
  ['İntervaller','İp 30/30 x4',4]]},
 BLB:{name:'Lower B',sub:'Hinge ağırlıklı, ~41 dk',rows:[
  ['Bant RDL','İki tutmaçlı bant, 3 sn iniş. 3x15, 60 sn',4.5],
  ['Tek bacak RDL','Vücut ağırlığı. 3x10/bacak, 45 sn',5],
  ['Devre 1','Zıplamalı lunge x8/bacak + şınav x10. 3 tur, 45 sn',5],
  ['Sandalyeye step-up','3x10/bacak, 60 sn',5],
  ['Glute bridge','Sarı pilates bandı diz üstünde. 3x15, 45 sn',3.5],
  ['Tek bacak calf raise','3x15/bacak, 30 sn',3],
  ['Core süperset','Leg raise x15 + kapıdan Pallof press x12/yan. 3 tur, 45 sn',5],
  ['İntervaller','İp 30/30 x4',4]]},
 C1:{name:'Hızlı C1',sub:'Üst ağırlıklı, ~22 dk',circ:true,rows:[
  ['Şınav','x12'],['Kapıdan bant row','x15'],['Bant deadlift','x15'],['Pike şınav','x8'],['Kapıdan bant face pull','x15'],['İp','45 sn'],['Plank','40 sn']]},
 C2:{name:'Hızlı C2',sub:'Alt ağırlıklı, ~22 dk',circ:true,rows:[
  ['Bant squat','x15'],['Tek bacak glute bridge','x10/bacak'],['Bant RDL','x15'],['Sandalyeye step-up','x10/bacak'],['Şınav','x10'],['İp','45 sn'],['Kapıdan Pallof press','x10/yan']]},
 YV:{name:'VO2 ip',sub:'~20 dk',vo2:true}
};
function viewYol(){
  const keys=['BUA','BLA','BUB','BLB','C1','C2','YV'];
  const tabs=`<div class="sel">${keys.map(k=>`<button class="${k===yol?'on':''}" onclick="yol='${k}';render(true)">${Y[k].name}</button>`).join('')}</div>`;
  const y=Y[yol];
  let body='';
  if(y.vo2){
    body=`<div class="card"><p class="ink">Isınma 4 dk (ip hafif + mobilite).</p><p class="ink">6 x (ip 1 dk sert / 1 dk yürüme). Sert bloklar konuşamayacak seviye.</p><p class="ink">Soğuma 4 dk.</p><p class="hint">Ana plandaki VO2 seansının yol karşılığı. Koşu seansı yolda da aynen yapılır.</p></div>`;
  } else if(y.circ){
    body=`<div class="card">${y.rows.map((r,i)=>{const id='y'+yol+i;return `<div class="row ${done[id]?'done':''}" onclick="done['${id}']=!done['${id}'];render(true)"><div class="n">${i+1}</div><div class="t"><b>${r[0]}</b></div><div class="m">${r[1]}</div></div>`}).join('')}<div class="sum"><span>3 tur, tur arası 60 sn</span><b>~15 dk</b></div><div class="sum" style="border:0;padding-top:4px"><span>Isınma + soğuma dahil</span><b>~22 dk</b></div></div><p class="hint">Zaman varsa 4. tur. Tükenme yok, form temiz, amaç kayıp önlemek. C1 ve C2 dönüşümlü.</p>`;
  } else {
    let tot=0;
    body=`<div class="card">${y.rows.map((r,i)=>{tot+=r[2];const id='y'+yol+i;return `<div class="row ${done[id]?'done':''}" onclick="done['${id}']=!done['${id}'];render(true)"><div class="n">${i+1}</div><div class="t"><b>${r[0]}</b><span>${r[1]}</span></div><div class="m">~${r[2]} dk</div></div>`}).join('')}<div class="sum"><span>Net iş</span><b>~${Math.round(tot)} dk</b></div><div class="sum" style="border:0;padding-top:4px"><span>Isınma + soğuma dahil</span><b>~${Math.round(tot)+8} dk</b></div></div>`;
  }
  return `<h1>Yol</h1><p>Ekipman: ip, sarı ve mavi tutmaçlı bant, sarı (20 kg) ve mavi (10 kg) pilates bandı, kapı sabitlemesi. Kayıt için seansı başlat.</p>${tabs}
  <h2>${y.name}</h2><p>${y.sub}</p>
  ${DB.active?'':`<button class="big pri" onclick="startS('Y:${yol}')">Bu seansı başlat</button>`}
  ${y.vo2?'':`<details><summary>Isınma, 4 dk</summary><ul class="warm">${YWARM.map(x=>`<li>${x}</li>`).join('')}</ul></details>`}
  ${body}
  ${y.vo2?'':`<details><summary>Soğuma, 4 dk</summary><ul class="warm">${YCOOL.map(x=>`<li>${x}</li>`).join('')}</ul></details>`}
  <details><summary>Yol kuralları</summary><ul>
   <li>Hafta ekranında "Seyahat: oda, aletli" veya "Seyahat: oda, kısa" seçince bu seanslar o haftanın planı olur.</li>
   <li>Hızlı seanslar C1, C2 dönüşümlü. Üç gün hızlı yapılacaksa C1, C2, C1.</li>
   <li>Yolda hangi kademede olursan ol haftada en az 2 seans.</li>
   <li>Otelde salon varsa ana plan: leg press → goblet squat, chest press → DB press, lat pulldown → DB row.</li>
   <li>Kapı: bant menteşe tarafına. Tutmaçlı bant tek başına kapı arasına sıkıştırılmaz, kapı aparatı veya havlu sarılı.</li>
   <li>Bant hafif gelirse iki bandı üst üste kullan veya tutuşu kısalt.</li>
  </ul></details>`;
}

render();
